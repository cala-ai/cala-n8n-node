name: Publish to npm

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # Version comes from the "packageManager" field in package.json.
      - uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # Trusted publishing (OIDC) needs npm >= 11.5.1; Node 22 ships an older npm.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest

      - name: Publish with provenance
        # No NPM_TOKEN: auth comes from GitHub OIDC via npm trusted publishing.
        # --ignore-scripts skips the local-only `prepublishOnly` guard
        # (`n8n-node prerelease`) that blocks non-interactive `npm publish`.
        run: npm publish --provenance --access public --ignore-scripts
