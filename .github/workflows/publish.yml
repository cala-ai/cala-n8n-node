name: Publish to npm

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # Version comes from the "packageManager" field in package.json.
      - uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # Trusted publishing (OIDC) needs npm >= 11.5.1; Node 22 ships an older npm.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest

      - name: Publish with provenance
        # No NPM_TOKEN: auth comes from GitHub OIDC via npm trusted publishing.
        # --ignore-scripts skips the local-only `prepublishOnly` guard
        # (`n8n-node prerelease`) that blocks non-interactive `npm publish`.
        run: npm publish --provenance --access public --ignore-scripts

      # The marketplace scanner only runs against a published package, so this
      # is our earliest gate on its rule set. Wait for the new version to
      # propagate to the registry, then scan it. A failure here means the
      # marketplace review would also reject this version.
      - name: Verify published version passes n8n community scan
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "Waiting for n8n-nodes-cala@$VERSION on npm..."
          for i in $(seq 1 30); do
            if [ "$(npm view n8n-nodes-cala@"$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
              echo "Found $VERSION on npm."
              break
            fi
            echo "  not visible yet (attempt $i/30), retrying in 10s..."
            sleep 10
          done
          npx @n8n/scan-community-package@latest n8n-nodes-cala
